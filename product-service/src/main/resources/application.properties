spring.application.name=product-service

server.port=8084

# ===============================
# Database
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Ecommerce_Products;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:12345}
internal.api-key=${INTERNAL_API_KEY:123456}

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# Category Service
# ===============================
category-service.url=http://localhost:8082

# ===============================
# Swagger
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
