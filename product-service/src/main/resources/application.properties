spring.application.name=product-service

server.port=${PORT:8084}

# ===============================
# Database
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=Ecommerce_Products;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}
internal.api-key=${INTERNAL_API_KEY:123456}

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Dependent Services
# ===============================
category-service.url=${CATEGORY_SERVICE_URL:http://localhost:8082}
auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# ===============================
# Swagger
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
