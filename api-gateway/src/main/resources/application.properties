server.port=${PORT:8080}
spring.application.name=api-gateway
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.web.servlet.function=INFO

# Service URLs
auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
category-service.url=${CATEGORY_SERVICE_URL:http://localhost:8082}
order-service.url=${ORDER_SERVICE_URL:http://localhost:8083}
product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8084}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
