spring.application.name=category-service
server.port=8082

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Ecommerce_Category;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Địa chỉ app chính, dùng để hỏi "category này còn sản phẩm không"
product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8084}
internal.api-key=${INTERNAL_API_KEY:123456}
