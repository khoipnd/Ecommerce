spring.application.name=category-service
server.port=${PORT:8082}

# ===============================
# Database
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=Ecommerce_Category;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===============================
# Dependent Services
# ===============================
product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8084}
auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
internal.api-key=${INTERNAL_API_KEY:123456}
