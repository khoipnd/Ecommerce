spring.application.name=order-service
server.port=${PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=Ecommerce_Order;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Phải trùng khóa với auth (app.jwt.secret). Khi chạy thật đặt bằng biến môi trường.
app.jwt.secret=${JWT_SECRET:jwtsecretkeyatleast32charactershaha}
app.jwt.expiration-minutes=120
app.jwt.issuer=auth-service

product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8084}
internal.api-key=${INTERNAL_API_KEY:123456}
