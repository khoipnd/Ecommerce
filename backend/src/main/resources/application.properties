spring.application.name=Ecommerce
server.port=${PORT:8080}

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=${SQL_INIT_MODE:never}

# ===============================
# Mật khẩu Admin
# Đổi mật khẩu admin tại đây hoặc thông qua biến môi trường ADMIN_PASSWORD trên Render
# ===============================
app.admin.password=${ADMIN_PASSWORD:123456}

# ===============================
# Hikari Connection Pool Settings
# ===============================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# ===============================
# Tối ưu RAM cho Render Free Tier (512MB)
# ===============================
spring.main.lazy-initialization=true

# ===============================
# JWT & Internal Security
# ===============================
app.jwt.secret=${JWT_SECRET:default_ecommerce_jwt_secret_key_minimum_32_characters_long_1234567890}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
internal.api-key=${INTERNAL_API_KEY:default-internal-secret-key-123456}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

spring.thymeleaf.cache=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
