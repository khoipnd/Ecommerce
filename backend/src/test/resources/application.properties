# Cấu hình CHỈ DÙNG KHI CHẠY TEST (file này che application.properties chính trong classpath test).
# Test dùng H2 in-memory (chế độ MySQL) nên không cần bật MySQL / SQL Server khi chạy mvn test / mvn package.
spring.application.name=Ecommerce-test

spring.datasource.url=jdbc:h2:mem:ecommerce_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never
