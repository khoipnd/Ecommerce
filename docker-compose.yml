services:
  # ====================================================
  # 1. Database Service (Microsoft SQL Server 2022)
  # ====================================================
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-database
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SqlAdmin@2026}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-SqlAdmin@2026}\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-SqlAdmin@2026}\" -Q 'SELECT 1'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ecommerce-net

  # ====================================================
  # 1.1 Database Auto-Init (Tạo 4 DB & Schema cho microservices)
  # ====================================================
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-db-init
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./Database:/sql:ro
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SqlAdmin@2026}"
    entrypoint: >
      /bin/bash -c "
      echo 'Đang khởi tạo các Database Microservices...'
      /opt/mssql-tools18/bin/sqlcmd -S database -U sa -P \"$${MSSQL_SA_PASSWORD:-SqlAdmin@2026}\" -C -i /sql/init-microservices.sql
      /opt/mssql-tools18/bin/sqlcmd -S database -U sa -P \"$${MSSQL_SA_PASSWORD:-SqlAdmin@2026}\" -C -i /sql/Ecommerce_Auth.sql || true
      echo 'Khởi tạo các Database Microservices hoàn tất!'
      "
    networks:
      - ecommerce-net

  # ====================================================
  # 2. Auth Service (Port 8081)
  # ====================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: ecommerce-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: auth-service
      PORT: "8081"
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://database:1433;databaseName=Ecommerce_Auth;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:-SqlAdmin@2026}"
      JWT_SECRET: "${JWT_SECRET:-jwtsecretkeyatleast32charactershaha}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin@12345}"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://127.0.0.1:5173}"
    depends_on:
      database:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - ecommerce-net

  # ====================================================
  # 3. Category Service (Port 8082)
  # ====================================================
  category-service:
    build:
      context: ./category-service
      dockerfile: Dockerfile
    container_name: ecommerce-category-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: category-service
      PORT: "8082"
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://database:1433;databaseName=Ecommerce_Category;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:-SqlAdmin@2026}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      PRODUCT_SERVICE_URL: "http://product-service:8084"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-123456}"
    depends_on:
      database:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    networks:
      - ecommerce-net

  # ====================================================
  # 4. Product Service (Port 8084)
  # ====================================================
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: ecommerce-product-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_APPLICATION_NAME: product-service
      PORT: "8084"
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://database:1433;databaseName=Ecommerce_Products;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:-SqlAdmin@2026}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      CATEGORY_SERVICE_URL: "http://category-service:8082"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-123456}"
    depends_on:
      database:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      category-service:
        condition: service_started
    networks:
      - ecommerce-net

  # ====================================================
  # 5. Order Service (Port 8083)
  # ====================================================
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: ecommerce-order-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: order-service
      PORT: "8083"
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://database:1433;databaseName=Ecommerce_Order;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:-SqlAdmin@2026}"
      PRODUCT_SERVICE_URL: "http://product-service:8084"
      JWT_SECRET: "${JWT_SECRET:-jwtsecretkeyatleast32charactershaha}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-123456}"
    depends_on:
      database:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      product-service:
        condition: service_started
    networks:
      - ecommerce-net

  # ====================================================
  # 6. API Gateway (Port 8080 - Single Entry Point)
  # ====================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: ecommerce-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      CATEGORY_SERVICE_URL: "http://category-service:8082"
      ORDER_SERVICE_URL: "http://order-service:8083"
      PRODUCT_SERVICE_URL: "http://product-service:8084"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://127.0.0.1:5173}"
    depends_on:
      - auth-service
      - category-service
      - product-service
      - order-service
    networks:
      - ecommerce-net

  # ====================================================
  # 7. Frontend Service (React + Vite + Nginx)
  # ====================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - ecommerce-net

# ====================================================
# Volumes & Networks
# ====================================================
volumes:
  mssql_data:

networks:
  ecommerce-net:
    driver: bridge
