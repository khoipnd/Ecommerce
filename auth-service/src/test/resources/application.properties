# Cấu hình CHỈ dùng khi chạy test: H2 in-memory, không cần bật MySQL/SQL Server.
spring.application.name=auth-service-test

spring.datasource.url=jdbc:h2:mem:auth_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

app.jwt.secret=test-secret-key-for-auth-service-tests-0123456789
app.jwt.expiration-minutes=60
app.jwt.issuer=auth-service

# strength thấp nhất (4) để test chạy nhanh; production dùng 10
app.security.bcrypt-strength=4

app.seed.enabled=true
app.seed.admin-password=123456

app.cors.allowed-origins=http://localhost:5173
