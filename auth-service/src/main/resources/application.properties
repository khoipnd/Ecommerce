spring.application.name=auth-service
server.port=${PORT:8081}

# ---------- Database ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Ecommerce_Auth;encrypt=true;trustServerCertificate=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:12345}}
spring.datasource.driver-class-name=${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:jwtsecretkeyatleast32charactershaha}
app.jwt.expiration-minutes=120
app.jwt.issuer=auth-service

# ---------- BCrypt ----------
app.security.bcrypt-strength=10

# ---------- Dữ liệu mẫu ----------
app.seed.enabled=true
app.seed.admin-password=${ADMIN_PASSWORD:admin123}

# ---------- CORS ----------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
