spring.application.name=auth-service
server.port=${PORT:8081}

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Ecommerce_Auth;encrypt=true;trustServerCertificate=true}
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120
app.jwt.issuer=auth-service

# ---------- BCrypt ----------
app.security.bcrypt-strength=10

# ---------- Dữ liệu mẫu ----------
app.seed.enabled=true
app.seed.admin-password=${ADMIN_PASSWORD}

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173